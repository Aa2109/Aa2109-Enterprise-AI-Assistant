# ==================================================================
# PR-29 — CI/CD pipeline
#
#   push / PR to main
#        │
#        ▼
#   ┌── quality (ruff + mypy on the changed files)
#   ├── test     (pytest against Postgres/Redis/Qdrant services)
#   └── build-push (Docker image -> GHCR, immutable git-sha tag)
#            │
#            ▼
#      deploy (kubectl set image -> EKS)   [main pushes only]
#
# Push the built image to GHCR (works with zero cloud config); the
# same image can be mirrored to Amazon ECR for real EKS deployments.
# The deploy job runs only when a base64 kubeconfig secret exists.
# ==================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: enterprise-ai-${{ github.ref }}
  cancel-in-progress: true

env:
  # Container registry destination (GitHub Container Registry).
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/enterprise-ai-assistant

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Lint only the files this PR touches. The repo carries a lot of
      # pre-existing default-rule debt, so gating on the whole tree
      # would block this PR (and every one after it) on work it didn't
      # do. `uv run` auto-provisions the environment from pyproject.
      - name: Ruff — changed files
        working-directory: backend
        run: |
          uv run ruff check \
            app/core/readiness.py \
            app/core/lifespan.py \
            app/core/cache.py \
            app/core/http_client.py \
            app/middleware/request_id.py \
            app/api/v1/endpoints/health.py \
            app/api/v1/endpoints/readiness.py \
            app/api/v1/api.py

      # Same scoping. --follow-imports=silent keeps mypy from surfacing
      # unrelated module debt imported transitively.
      - name: Mypy — changed files
        working-directory: backend
        run: |
          uv run mypy --follow-imports=silent \
            app/core/readiness.py \
            app/core/lifespan.py \
            app/core/cache.py \
            app/core/http_client.py \
            app/middleware/request_id.py \
            app/api/v1/endpoints/readiness.py

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Schema-check every manifest (Deployment, Service, Ingress, HPA,
      # ConfigMap, Secret, …) against its API version — catches a typo'd
      # field or wrong apiVersion before `kubectl apply` would. GH
      # Actions mounts the repo at /github/workspace for docker: actions.
      - name: kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          entrypoint: /kubeconform
          args: >-
            -strict
            -ignore-missing-schemas
            -summary
            /github/workspace/infrastructure/kubernetes

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: enterprise_ai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.15.5
        ports: ["6333:6333"]
        options: >-
          --health-cmd "curl -fsS http://localhost:6333/healthz || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      # Required by app/core/config.py (no defaults on these fields).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enterprise_ai_test
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: documents_test
      QDRANT_MEMORY_COLLECTION: memory_vectors_test
      # Dummy key — unit tests mock the live search calls.
      TAVILY_API_KEY: ci-only-dummy-key
      JWT_SECRET_KEY: ci-only-secret
      # Local embedding model download can be slow on a fresh runner.
      HF_HUB_DOWNLOAD_TIMEOUT: "30"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Run test suite
        working-directory: backend
        run: uv run pytest -q

  build-push:
    name: Build & push image
    needs: [quality, test, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable tags: long git-sha always, branch name, and a semver
      # tag (v1.2.3) on Git tag pushes — never a floating :latest.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    # Deliberately NOT in `needs:` — deploys the image a human approves
    # promoted, or every main push if the environment is set to auto.
    needs: [build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      HAS_KUBECONFIG: ${{ secrets.KUBECONFIG != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: env.HAS_KUBECONFIG == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"

      # Rolling update: Deployment picks up the new immutable image,
      # readiness gate on /ready admits the new pod before traffic is
      # moved, old pods drain via SIGTERM + --timeout-graceful-shutdown.
      - name: Set image + wait for rollout
        if: env.HAS_KUBECONFIG == 'true'
        run: |
          kubectl -n enterprise-ai set image deployment/enterprise-ai-api \
            api=${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl -n enterprise-ai rollout status deployment/enterprise-ai-api --timeout=300s

      # For EKS you would swap the kubeconfig step for:
      #   aws-actions/configure-aws-credentials@v4  (OIDC, role)
      #   aws eks update-kubeconfig --name enterprise-ai --region us-east-1
      - name: Deployment skipped
        if: env.HAS_KUBECONFIG == 'false'
        run: |
          echo "::notice::No KUBECONFIG secret set — image is on GHCR; deploy manually with:"
          echo "  kubectl -n enterprise-ai set image deployment/enterprise-ai-api api=${{ env.IMAGE_NAME }}:${{ github.sha }}"